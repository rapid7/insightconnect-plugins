plugin_spec_version: v2
extension: plugin
products: [insightconnect]
name: dectrax
title: DECTRAX
description: "DECTRAX is a cyber deception platform that deploys high-interaction decoys, honeypots, and threat telemetry feeds. This plugin queries attacker IP intelligence, inspects telemetry alerts, and retrieves EDL feeds"
version: 1.0.0
connection_version: 1
vendor: rapid7
support: community
supported_versions: ['1.0.0']
status: []
cloud_ready: true
sdk:
  type: slim
  version: 6.6.1
  user: nobody
resources:
  source_url: https://github.com/Sadman-TheDentian/dectrace
  license_url: https://github.com/rapid7/insightconnect-plugins/blob/master/LICENSE
  vendor_url: https://github.com/Sadman-TheDentian/dectrace
key_features:
- Retrieve real-time attacker IP feeds generated by deception decoys
- Query interaction telemetry and targeted protocols for specific IPs
- Download External Dynamic List (EDL) feeds for perimeter blocking
requirements:
- DECTRAX instance URL and optional API Key
troubleshooting:
- "Ensure the DECTRAX instance URL is reachable from the InsightConnect orchestrator"
- "Verify that the API Key has sufficient read permissions for threat intelligence endpoints"
links:
- "[DECTRAX Repository](https://github.com/Sadman-TheDentian/dectrace)"
references:
- "[DECTRAX Documentation](https://github.com/Sadman-TheDentian/dectrace#readme)"
tags:
- dectrax
- deception
- honeypot
- threat-intelligence
hub_tags:
  use_cases: [data_enrichment, threat_detection_and_response]
  keywords: [threat_intelligence, cloud_enabled]
  features: []
version_history:
- 1.0.0 - Initial plugin release
enable_cache: false

types:
  telemetry_event:
    timestamp:
      title: Timestamp
      type: string
      description: Event timestamp
      required: false
    decoy_service:
      title: Decoy Service
      type: string
      description: Target decoy service name
      required: false
    protocol:
      title: Protocol
      type: string
      description: Network protocol
      required: false
    interaction_type:
      title: Interaction Type
      type: string
      description: Type of interaction observed
      required: false

connection:
  url:
    title: Server URL
    description: Base URL of the DECTRAX instance e.g. https://dectrax.internal:8443
    type: string
    required: true
    example: https://dectrax.internal:8443
  api_key:
    title: API Key
    description: API Key for authenticating with DECTRAX
    type: credential_secret_key
    required: false
    example: "9d8f3b2a-1c4e-5d6f-7a8b-9c0d1e2f3a4b"
  ssl_verify:
    title: SSL Verify
    description: Verify SSL certificate of DECTRAX instance
    type: boolean
    default: true
    required: true
    example: true

actions:
  get_attacker_ips:
    title: Get Attacker IPs
    description: Retrieve list of malicious IP addresses observed interacting with deception decoys
    input:
      limit:
        title: Limit
        type: integer
        description: Maximum number of IPs to return
        default: 100
        required: false
        example: 100
    output:
      attackers:
        title: Attacker IPs
        type: '[]string'
        description: List of attacker IP addresses
        required: true
        example: ["198.51.100.24", "203.0.113.88"]
      count:
        title: Count
        type: integer
        description: Total count of attacker IPs
        required: true
        example: 2

  query_telemetry:
    title: Query Telemetry
    description: Query deception telemetry events for a specific IP address
    input:
      ip:
        title: IP Address
        type: string
        description: IP address to query
        required: true
        example: 198.51.100.24
    output:
      found:
        title: Found
        type: boolean
        description: Whether interaction telemetry was found for the IP
        required: true
        example: true
      events_count:
        title: Events Count
        type: integer
        description: Number of decoy events associated with this IP
        required: true
        example: 5
      protocols:
        title: Protocols
        type: '[]string'
        description: Protocols targeted by the attacker
        required: false
        example: ["ssh", "http"]

  get_edl_feed:
    title: Get EDL Feed
    description: Fetch raw External Dynamic List (EDL) plain-text feed for firewall or perimeter blocking
    input: {}
    output:
      feed_content:
        title: Feed Content
        type: string
        description: Raw plain-text list of blocked attacker IPs
        required: true
        example: "198.51.100.24"
      success:
        title: Success
        type: boolean
        description: Whether the feed was fetched successfully
        required: true
        example: true
