actions:
  create:
    title: Create Ticket
    description: Create OTRS ticket
    input:
      Title:
        title: Title
        description: Ticket title
        type: string
        required: false
        example: Suspicious login detected
      Queue:
        title: Queue
        description: Queue the ticket is to be inserted in
        type: string
        required: false
        example: Raw
      Lock:
        title: Lock
        description: Lock name
        type: string
        required: false
        example: unlock
      Type:
        title: Type
        description: Ticket type e.g. Incident
        type: string
        required: false
        example: Incident
      Service:
        title: Service
        description: Service name
        type: string
        required: false
        example: IT Security
      SLA:
        title: SLA
        description: SLA name
        type: string
        required: false
        example: Gold
      State:
        title: State
        description: Ticket state
        type: string
        required: false
        default: new
        example: new
      Priority:
        title: Priority
        description: Ticket priority. 1=very low, 2=low, 3=normal, 4=high, 5=very
          high, etc
        type: string
        required: false
        example: 3 normal
      PendingTime:
        title: Pending Time
        description: Pending time field
        type: date
        required: false
        example: 2026-11-01T12:00:00Z
      Owner:
        title: Owner
        description: Ticket owner
        type: string
        required: false
        example: agent
      Responsible:
        title: Responsible
        description: User responsible for the ticket
        type: string
        required: false
        example: agent
      CustomerUser:
        title: Customer User
        description: Customer user associated with the ticket e.g test_customer
        type: string
        required: false
        example: test_customer
      article:
        title: Article
        description: Ticket article
        type: new_article
        required: false
        example: '{"Subject": "Suspicious login", "Body": "Suspicious login detected for user jdoe", "MimeType": "text/plain", "Charset": "UTF-8", "CommunicationChannel": "Internal", "SenderType": "agent"}'
      dynamic_fields:
        title: Dynamic Fields
        description: Fields as array of objects e.g. [{"name":"TestName1","pattern":"TestValue1"},{"name":"TestName2","pattern":"TestValue2"}]
        type: '[]dynamic_field'
        required: false
        example: [{"name": "TestName1", "value": "TestValue1"}]
      attachments:
        title: Attachments
        description: Attachments as array of objects e.g. [{"filename":"notes.txt","content":"VGhpcyBpcyBhIHRlc3QK"}]
        type: '[]attachment'
        required: false
        example: [{"filename": "notes.txt", "content": "VGhpcyBpcyBhIHRlc3QK"}]
    output:
      ticket_id:
        title: Ticket ID
        description: ID of the created ticket
        type: integer
        required: false
        example: 1
      ticket_number:
        title: Ticket Number
        description: Number of the created ticket
        type: integer
        required: false
        example: 2026101910000011
  update:
    title: Update Ticket
    description: Update OTRS ticket
    input:
      TicketID:
        title: Ticket ID
        description: Ticket ID
        type: integer
        required: false
        example: 7
      Priority:
        title: Priority
        description: Updated ticket priority e.g. 1 very low, 2 low, 3 normal, 4 high,
          5 very high and so on
        type: string
        required: false
        example: 4 high
      PendingTime:
        title: Pending Time
        description: Pending time
        type: date
        required: false
        example: 2026-11-01T12:00:00Z
      Lock:
        title: Lock
        description: Lock
        type: string
        required: false
        example: lock
      Service:
        title: Service
        description: Service
        type: string
        required: false
        example: IT Security
      SLA:
        title: SLA
        description: SLA
        type: string
        required: false
        example: Gold
      Queue:
        title: Queue
        description: Updated queue
        type: string
        required: false
        example: Junk
      Responsible:
        title: Responsible
        description: Responsible
        type: string
        required: false
        example: agent
      Title:
        title: Title
        description: Updated title
        type: string
        required: false
        example: Suspicious login confirmed
      CustomerUser:
        title: Customer User
        description: Updated customer user
        type: string
        required: false
        example: test_customer
      Type:
        title: Type
        description: Updated type e.g. Incident
        type: string
        required: false
        example: Incident
      NoArticle:
        title: No Article
        description: Will not add article to ticket
        type: boolean
        required: true
        example: false
      Article:
        title: Article
        description: New article (gets appended)
        type: new_article
        required: false
        example: '{"Subject": "Suspicious login", "Body": "Suspicious login detected for user jdoe", "MimeType": "text/plain", "Charset": "UTF-8", "CommunicationChannel": "Internal", "SenderType": "agent"}'
      DynamicFields:
        title: Dynamic Fields
        description: Updated dynamic fields e.g. [{"name":"TestName1","value":"TestValue1"},{"name":"TestName2","value":"TestValue2"}]
        type: '[]dynamic_field'
        required: false
        example: [{"name": "TestName1", "value": "TestValue1"}]
      Attachments:
        title: Attachments
        description: New attachments as array of objects e.g. [{"filename":"notes.txt","content":"VGhpcyBpcyBhIHRlc3QK"}]
        type: '[]attachment'
        required: false
        example: [{"filename": "notes.txt", "content": "VGhpcyBpcyBhIHRlc3QK"}]
    output:
      ticket_id:
        title: Ticket ID
        description: ID of the updated ticket
        type: integer
        required: false
        example: 1
      ticket_number:
        title: Ticket Number
        description: Number of the updated ticket
        type: integer
        required: false
        example: 2026101910000011
  search:
    title: Ticket Search
    description: Search for OTRS tickets
    input:
      cust_id:
        title: Customer ID
        description: Customer ID
        type: string
        required: false
        example: example-customer
      external_params:
        title: External Parameters
        description: A key value object that is not a Dynamic Field e.g [{"Title":"Test Ticket"}]
        type: '[]external_param'
        required: false
        example: [{"Title": "Test Ticket"}]
      queue:
        title: Queue
        description: Queue to search in
        type: string
        required: false
        example: Raw
      dynamic_fields:
        title: Dynamic Fields
        description: Fields as array of objects e.g. [{"name":"TestName1","value":"TestValue1", "operation":"Equals"},{"name":"TestName2","value":"TestValue2"}]. The value field is what will be searched for
        type: '[]search_dynamic_field'
        required: false
        example: [{"name": "TestName1", "value": "TestValue1", "operator": "Equals"}]
    output:
      ticket_ids:
        title: Ticket IDs
        description: IDs of tickets matching search criteria
        type: '[]string'
        required: false
        example: ["1", "2"]
  retrieve:
    title: Retrieve Ticket
    description: Retrieve OTRS ticket
    input:
      ticket_id:
        title: Ticket ID
        description: Ticket ID
        type: integer
        required: false
        example: 7
    output:
      Ticket:
        title: Ticket
        description: Ticket details with articles, attachments and dynamic fields
        type: Ticket
        required: false
        example: '{"TicketID": 1, "TicketNumber": "2026101910000011", "Title": "Suspicious login", "Queue": "Raw", "State": "new", "Priority": "3 normal", "Article": [{"ArticleID": "1", "TicketID": 1, "Subject": "Suspicious login", "Body": "Investigate login from new location", "IsVisibleForCustomer": 1}], "DynamicField": [{"Name": "Severity", "Value": ["High"]}]}'
