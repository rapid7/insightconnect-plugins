plugin_spec_version: v2
extension: plugin
products:
- insightconnect
name: vpndetection
title: VPNDetection
description: Check whether an IP address is a VPN, a privacy relay, a Tor exit, a hosting or CDN address or a proxy with [VPNDetection](https://vpndetection.io),
  with its location, its ASN and, with an API key, the provider behind each detection
version: 1.0.0
connection_version: 1
vendor: vpndetection
support: community
status: []
supported_versions:
- VPNDetection API 2026-11-20
sdk:
  type: slim
  version: 6.6.1
  user: nobody
key_features:
- Check an IP address for VPN, privacy relay and Tor use, with its hostname, country and ASN, with no API key
- With an API key, add hosting, CDN and residential, datacenter, mobile and public proxy detection, each with its provider,
  its confidence and the date last seen, the city, the organization and the abuse contact
requirements:
- None for the VPN, relay, Tor and anycast flags, the hostname, the country and the ASN. A [VPNDetection API key](https://vpndetection.io/pricing)
  adds the hosting, CDN, proxy and service flags, the providers, the city, the organization and the abuse contact
troubleshooting:
- 'Without an API key, or once a free key''s trial is spent, the `partial` output is `true` and the flags that need a key
  are left out: a missing flag means unknown, not false'
- A private or reserved address answers `is_bogon` `true` and nothing else
- 'An invalid API key fails the connection test with a 401 error: check the key in your VPNDetection account'
version_history:
- '1.0.0 - Initial plugin - Actions: `Lookup IP Address`'
links:
- '[VPNDetection](https://vpndetection.io)'
- '[Terms of use, including keyless use](https://vpndetection.io/terms#no-key)'
- '[Privacy policy](https://vpndetection.io/privacy)'
references:
- '[VPNDetection API](https://docs.vpndetection.io)'
resources:
  source_url: https://github.com/rapid7/insightconnect-plugins/tree/master/plugins/vpndetection
  license_url: https://github.com/rapid7/insightconnect-plugins/blob/master/LICENSE
  vendor_url: https://vpndetection.io
tags:
- ip
- vpn
- tor
- proxy
- geoip
- threat intelligence
hub_tags:
  use_cases:
  - data_enrichment
  - threat_detection_and_response
  keywords:
  - ip_address
  - geoip
  - enrichment
  - threat_intelligence
  - network
  features: []
enable_cache: false
types:
  detection:
    provider:
      title: Provider
      description: The provider's identifier
      type: string
      required: false
      example: 1clickvpn
    provider_name:
      title: Provider Name
      description: The provider's name
      type: string
      required: false
      example: 1Click VPN
    confidence:
      title: Confidence
      description: 'How sure the detection is: low, medium or high'
      type: string
      required: false
      example: high
    last_seen:
      title: Last Seen
      description: The date the address was last seen as one, YYYY-MM-DD
      type: string
      required: false
      example: '2026-11-20'
  location:
    continent:
      title: Continent
      description: The continent code
      type: string
      required: false
      example: EU
    continent_name:
      title: Continent Name
      description: The continent's name
      type: string
      required: false
      example: Europe
    country:
      title: Country
      description: The ISO 3166-1 alpha-2 country code
      type: string
      required: false
      example: DE
    country_name:
      title: Country Name
      description: The country's name
      type: string
      required: false
      example: Germany
    region:
      title: Region
      description: The region (needs an API key)
      type: string
      required: false
      example: Berlin
    region_code:
      title: Region Code
      description: The ISO 3166-2 region code (needs an API key)
      type: string
      required: false
      example: DE-BE
    city:
      title: City
      description: The city (needs an API key)
      type: string
      required: false
      example: Berlin
    postal_code:
      title: Postal Code
      description: The postal code (needs an API key)
      type: string
      required: false
      example: '10115'
    latitude:
      title: Latitude
      description: The latitude (needs an API key)
      type: float
      required: false
      example: 52.52
    longitude:
      title: Longitude
      description: The longitude (needs an API key)
      type: float
      required: false
      example: 13.405
    accuracy_radius:
      title: Accuracy Radius
      description: How far off the coordinates may be, in kilometers (needs an API key)
      type: integer
      required: false
      example: 10
    timezone:
      title: Timezone
      description: The IANA time zone
      type: string
      required: false
      example: Europe/Berlin
  asn:
    asn:
      title: ASN
      description: The autonomous system number
      type: integer
      required: false
      example: 60729
    name:
      title: Name
      description: The autonomous system's name
      type: string
      required: false
      example: Stiftung Erneuerbare Freiheit
    domain:
      title: Domain
      description: The autonomous system's domain
      type: string
      required: false
      example: zwiebelfreunde.de
    type:
      title: Type
      description: 'The kind of network: hosting, isp, business, education or government'
      type: string
      required: false
      example: hosting
    prefix:
      title: Prefix
      description: The announced prefix that holds the address
      type: string
      required: false
      example: 185.220.101.0/24
    country:
      title: Country
      description: The autonomous system's country code
      type: string
      required: false
      example: DE
    rpki_status:
      title: RPKI Status
      description: The prefix's RPKI validation status
      type: string
      required: false
      example: valid
  company:
    name:
      title: Name
      description: The organization's name
      type: string
      required: false
      example: SERVERS COM LUX2
    domain:
      title: Domain
      description: The organization's domain
      type: string
      required: false
      example: servers.com
    type:
      title: Type
      description: The kind of organization
      type: string
      required: false
      example: hosting
    country:
      title: Country
      description: The organization's country code
      type: string
      required: false
      example: LU
  abuse:
    email:
      title: Email
      description: The abuse contact's email address
      type: string
      required: false
      example: user@example.com
    name:
      title: Name
      description: The abuse contact's name
      type: string
      required: false
      example: Example Networks
    phone:
      title: Phone
      description: The abuse contact's phone number
      type: string
      required: false
      example: +1-555-0100
    address:
      title: Address
      description: The abuse contact's postal address
      type: string
      required: false
      example: 1 Example Street, Springfield
    country:
      title: Country
      description: The abuse contact's country code
      type: string
      required: false
      example: US
    network:
      title: Network
      description: The registered network the contact covers
      type: string
      required: false
      example: 188.42.0.0-188.42.255.255
connection:
  api_key:
    title: API Key
    description: 'VPNDetection API key. Optional: without one the plugin answers the VPN, relay, Tor and anycast flags, the
      hostname, the country and the ASN'
    type: credential_secret_key
    required: false
    example: 9de5069c5afe602b2ea0a04b66beb2c0
actions:
  lookup_ip:
    title: Lookup IP Address
    description: Check an IP address for VPN, privacy relay, Tor, hosting, CDN and proxy use, with its location and ASN
    input:
      address:
        title: Address
        description: The IPv4 or IPv6 address to look up
        type: string
        required: true
        example: 185.220.101.1
    output:
      ip:
        title: IP
        description: The address looked up
        type: string
        required: true
        example: 185.220.101.1
      is_bogon:
        title: Is Bogon
        description: Whether the address is private or reserved, so not routed on the internet
        type: boolean
        required: true
        example: false
      is_vpn:
        title: Is VPN
        description: Whether the address is a VPN server's exit
        type: boolean
        required: true
        example: false
      is_relay:
        title: Is Relay
        description: Whether the address is a privacy relay's or web gateway's exit
        type: boolean
        required: true
        example: false
      is_tor:
        title: Is Tor
        description: Whether the address is a Tor exit node
        type: boolean
        required: true
        example: true
      is_anycast:
        title: Is Anycast
        description: Whether the address is announced from many locations (anycast)
        type: boolean
        required: true
        example: false
      is_hosting:
        title: Is Hosting
        description: Whether the address belongs to a hosting or cloud provider (needs an API key)
        type: boolean
        required: false
        example: false
      is_cdn:
        title: Is CDN
        description: Whether the address belongs to a content delivery network (needs an API key)
        type: boolean
        required: false
        example: false
      is_resproxy:
        title: Is Residential Proxy
        description: Whether the address is a residential proxy's exit (needs an API key)
        type: boolean
        required: false
        example: false
      is_dcproxy:
        title: Is Datacenter Proxy
        description: Whether the address is a datacenter proxy's exit (needs an API key)
        type: boolean
        required: false
        example: false
      is_mobproxy:
        title: Is Mobile Proxy
        description: Whether the address is a mobile proxy's exit (needs an API key)
        type: boolean
        required: false
        example: false
      is_pubproxy:
        title: Is Public Proxy
        description: Whether the address runs an open public proxy (needs an API key)
        type: boolean
        required: false
        example: false
      is_carrier:
        title: Is Carrier
        description: Whether the address belongs to a mobile carrier (needs an API key)
        type: boolean
        required: false
        example: false
      is_satellite:
        title: Is Satellite
        description: Whether the address belongs to a satellite internet provider (needs an API key)
        type: boolean
        required: false
        example: false
      is_ssh:
        title: Is SSH
        description: Whether the address runs an SSH server (needs an API key)
        type: boolean
        required: false
        example: false
      is_smtp:
        title: Is SMTP
        description: Whether the address runs an SMTP server (needs an API key)
        type: boolean
        required: false
        example: false
      is_web:
        title: Is Web
        description: Whether the address runs a web server (needs an API key)
        type: boolean
        required: false
        example: false
      is_dns_resolver:
        title: Is DNS Resolver
        description: Whether the address runs an open DNS resolver (needs an API key)
        type: boolean
        required: false
        example: false
      is_bittorrent:
        title: Is BitTorrent
        description: Whether the address was seen on BitTorrent (needs an API key)
        type: boolean
        required: false
        example: false
      vpn:
        title: VPN
        description: 'VPN detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      relay:
        title: Relay
        description: 'Relay detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      tor:
        title: Tor
        description: 'Tor detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      hosting:
        title: Hosting
        description: 'Hosting detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      cdn:
        title: CDN
        description: 'CDN detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      resproxy:
        title: Residential Proxy
        description: 'Residential Proxy detection: the provider, the confidence and the date the address was last seen as
          one'
        type: detection
        required: false
      dcproxy:
        title: Datacenter Proxy
        description: 'Datacenter Proxy detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      mobproxy:
        title: Mobile Proxy
        description: 'Mobile Proxy detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      pubproxy:
        title: Public Proxy
        description: 'Public Proxy detection: the provider, the confidence and the date the address was last seen as one'
        type: detection
        required: false
      location:
        title: Location
        description: 'Where the address is: the country without an API key, down to the city with one'
        type: location
        required: false
      asn:
        title: ASN
        description: The autonomous system that announces the address
        type: asn
        required: false
      hostname:
        title: Hostname
        description: The address's reverse DNS hostname
        type: string
        required: false
        example: berlin01.tor-exit.artikel10.org
      company:
        title: Company
        description: The organization the address is registered to (needs an API key)
        type: company
        required: false
      abuse:
        title: Abuse
        description: The address's abuse contact (needs an API key)
        type: abuse
        required: false
      partial:
        title: Partial
        description: 'True when the answer lacks the flags that need an API key: no key is set, a free key''s trial is spent,
          or the organization''s overage cap is reached. A missing flag then means unknown, not false'
        type: boolean
        required: true
        example: true
