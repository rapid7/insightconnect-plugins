plugin_spec_version: v2
extension: plugin
products: [insightconnect]
name: rapid7_intelhub
title: Rapid7 IntelHub
description: Access Rapid7 Intelligence Hub for threat intelligence data including CVE information, vulnerabilities, and security insights
version: 1.0.0
connection_version: 1
supported_versions: ["v1"]
vendor: rapid7
support: rapid7
cloud_ready: true
fedramp_ready: true
sdk:
  type: slim
  version: 6.6.0
  user: nobody
key_features:
  - Search CVE database for vulnerability information
  - Retrieve detailed CVE information by ID
  - Access threat intelligence data from Rapid7 Intelligence Hub
requirements:
  - Rapid7 Insight Platform API Key
  - An InsightIDR or Intelligence Hub license for the organization that owns the API key
troubleshooting:
  - Ensure your API key has access to Intelligence Hub
  - Verify the correct region is selected for your account
  - If the connection test fails with `Product license not found`, the API key is valid but its organization has neither an InsightIDR nor an Intelligence Hub license
  - The CVE ID input of the Get CVE action also accepts a Rapid7 vulnerability ID that contains a CVE ID, such as `apple-itunes-cve-2019-8835`, so a workflow that used the Get Content action of the Rapid7 Vulnerability & Exploit Database plugin can pass the same identifier. Rapid7 vulnerability IDs without a CVE ID, and Metasploit module IDs, cannot be looked up
  - The Search input of the Search CVEs action matches part of the CVE ID, such as `CVE-2024` or `3400`, not keywords in the CVE title or description
  - Intelligence Hub does not provide Metasploit modules or vulnerability solutions
status: []
resources:
  source_url: https://github.com/rapid7/insightconnect-plugins/tree/master/plugins/rapid7_intelhub
  license_url: https://github.com/rapid7/insightconnect-plugins/blob/master/LICENSE
  vendor_url: https://www.rapid7.com
tags:
  - threat_intelligence
  - cve
  - vulnerability
  - rapid7
  - intelhub
references:
  - "[Rapid7 Intelligence Hub](https://docs.rapid7.com/intelligence-hub/)"
links:
  - "[Rapid7 Insight Platform](https://insight.rapid7.com)"
version_history:
  - "1.0.0 - Initial plugin"
hub_tags:
  use_cases: [threat_detection_and_response, vulnerability_management]
  keywords: [threat_intelligence, cve, exploit, rapid7, cloud_enabled]
  features: []
enable_cache: false
language: python
types:
  cve:
    cve_id:
      title: CVE ID
      description: The CVE identifier
      type: string
      required: false
    title:
      title: Title
      description: Title of the CVE. For CVEs without a description, it can hold the full CVE description
      type: string
      required: false
    description:
      title: Description
      description: Description of the vulnerability
      type: string
      required: false
    tags:
      title: Tags
      description: Tags describing the vulnerability
      type: "[]string"
      required: false
    published_date:
      title: Published Date
      description: Date the CVE was published
      type: string
      required: false
    modified_date:
      title: Modified Date
      description: Date the CVE was last modified
      type: string
      required: false
    cvss_v3_base_score:
      title: CVSS v3 Base Score
      description: CVSS v3 base score of the vulnerability
      type: number
      required: false
    cvss_v3_severity:
      title: CVSS v3 Severity
      description: CVSS v3 severity of the vulnerability
      type: string
      required: false
    cvss_v3_vector:
      title: CVSS v3 Vector
      description: CVSS v3 vector string
      type: string
      required: false
    cvss_v4_base_score:
      title: CVSS v4 Base Score
      description: CVSS v4 base score of the vulnerability
      type: number
      required: false
    cvss_v4_severity:
      title: CVSS v4 Severity
      description: CVSS v4 severity of the vulnerability
      type: string
      required: false
    cvss_v4_vector:
      title: CVSS v4 Vector
      description: CVSS v4 vector string
      type: string
      required: false
    epss_score:
      title: EPSS Score
      description: Exploit Prediction Scoring System (EPSS) probability, from 0 to 1, that the vulnerability will be exploited
      type: number
      required: false
    epss_percentile:
      title: EPSS Percentile
      description: Percentile of the EPSS score among all scored CVEs, from 0 to 1
      type: number
      required: false
    active_risk_score:
      title: Active Risk Score
      description: Rapid7 Active Risk score of the vulnerability, from 0 to 1000
      type: integer
      required: false
    exploitable:
      title: Exploitable
      description: Whether the CVE is exploitable
      type: boolean
      required: false
    exploited_in_the_wild:
      title: Exploited in the Wild
      description: Whether the CVE has been exploited in the wild
      type: boolean
      required: false
    cisa_kev:
      title: CISA KEV
      description: Whether the CVE is in the CISA Known Exploited Vulnerabilities catalog
      type: boolean
      required: false
    campaign_count:
      title: Campaign Count
      description: Number of campaigns associated with the CVE
      type: integer
      required: false
    threat_actor_count:
      title: Threat Actor Count
      description: Number of threat actors associated with the CVE
      type: integer
      required: false
    references:
      title: References
      description: List of reference URLs
      type: "[]string"
      required: false
  pagination:
    page:
      title: Page
      description: Current page number
      type: integer
      required: false
    page_size:
      title: Page Size
      description: Number of results per page
      type: integer
      required: false
    total_count:
      title: Total Count
      description: Total number of results available
      type: integer
      required: false
    total_pages:
      title: Total Pages
      description: Total number of pages available
      type: integer
      required: false
connection:
  api_key:
    title: API Key
    description: Rapid7 Insight Platform API Key
    type: credential_secret_key
    required: true
    example: '{"secretKey": "abc123-def456-ghi789"}'
  region:
    title: Region
    description: The region for your Rapid7 Insight Platform account
    type: string
    required: true
    enum:
      - United States
      - Europe
      - Canada
      - Australia
      - Japan
    default: United States
    example: United States
actions:
  search_cves:
    title: Search CVEs
    description: Search the Intelligence Hub CVE database
    input:
      search:
        title: Search
        description: Part of the CVE ID to search for, such as CVE-2024 or 3400
        type: string
        required: false
        example: "CVE-2024"
      page:
        title: Page
        description: Page number for pagination (starts at 1)
        type: integer
        required: false
        default: 1
        example: 1
      page_size:
        title: Page Size
        description: Number of results per page (max 100)
        type: integer
        required: false
        default: 10
        example: 10
      cvss_score:
        title: CVSS Score
        description: Filter by CVSS severity level
        type: string
        required: false
        enum:
          - ""
          - critical
          - high
          - medium
          - low
          - informational
        example: "high"
      exploitable:
        title: Exploitable
        description: Filter by whether the CVE is exploitable
        type: boolean
        required: false
        example: true
      epss_score:
        title: EPSS Score Range
        description: Filter by EPSS score range (e.g., 0-0.5, 0.5-1)
        type: string
        required: false
        example: "0-0.5"
      cisa_kev:
        title: CISA KEV
        description: Filter by CISA Known Exploited Vulnerabilities catalog
        type: boolean
        required: false
        example: true
      last_updated:
        title: Last Updated
        description: Filter by the time range in which the CVE was last updated
        type: string
        required: false
        enum:
          - ""
          - last 20 minutes
          - last 1 hour
          - last 6 hours
          - last 12 hours
          - last 24 hours
          - last 48 hours
          - last 72 hours
        example: "last 24 hours"
    output:
      cves:
        title: CVEs
        description: List of CVEs matching the search criteria
        type: "[]cve"
        required: true
        example: '[{"cve_id": "CVE-2024-3400", "title": "CVE-2024-3400: Improper Neutralization of Special Elements used in a Command", "published_date": "2024-04-12T00:00:00", "modified_date": "2025-11-21T00:00:00", "cvss_v3_base_score": 10.0, "cvss_v3_severity": "Critical", "cvss_v3_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "epss_score": 0.94297, "epss_percentile": 0.9994, "active_risk_score": 1000, "exploitable": true, "exploited_in_the_wild": true, "cisa_kev": true, "campaign_count": 9, "threat_actor_count": 3, "references": [], "description": "A command injection as a result of arbitrary file creation vulnerability in the GlobalProtect feature of Palo Alto Networks PAN-OS software for specific PAN-OS versions and distinct feature configurations may enable an unauthenticated attacker to execute arbitrary code with root privileges on the firewall.\n\nCloud NGFW, Panorama appliances, and Prisma Access are not impacted by this vulnerability.", "tags": ["Remote Execution", "CISA KEV", "Exploited in the Wild", "Rapid7 Critical"]}]'
      pagination:
        title: Pagination
        description: Pagination information for the results
        type: pagination
        required: false
        example: '{"page": 1, "page_size": 10, "total_count": 100, "total_pages": 10}'
  get_cve:
    title: Get CVE
    description: Get detailed information about a specific CVE by ID
    input:
      cve_id:
        title: CVE ID
        description: The CVE ID to look up, or a Rapid7 vulnerability ID that contains one (e.g., CVE-2024-3400 or apple-itunes-cve-2019-8835)
        type: string
        required: true
        example: "CVE-2024-3400"
    output:
      cve:
        title: CVE
        description: Detailed CVE information
        type: cve
        required: true
        example: '{"cve_id": "CVE-2024-3400", "title": "CVE-2024-3400: Improper Neutralization of Special Elements used in a Command", "published_date": "2024-04-12T00:00:00", "modified_date": "2025-11-21T00:00:00", "cvss_v3_base_score": 10.0, "cvss_v3_severity": "Critical", "cvss_v3_vector": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H", "epss_score": 0.94297, "epss_percentile": 0.9994, "active_risk_score": 1000, "exploitable": true, "exploited_in_the_wild": true, "cisa_kev": true, "campaign_count": 9, "threat_actor_count": 3, "references": [], "description": "A command injection as a result of arbitrary file creation vulnerability in the GlobalProtect feature of Palo Alto Networks PAN-OS software for specific PAN-OS versions and distinct feature configurations may enable an unauthenticated attacker to execute arbitrary code with root privileges on the firewall.\n\nCloud NGFW, Panorama appliances, and Prisma Access are not impacted by this vulnerability.", "tags": ["Remote Execution", "CISA KEV", "Exploited in the Wild", "Rapid7 Critical"]}'
      found:
        title: Found
        description: Whether the CVE was found
        type: boolean
        required: true
        example: true
  search_threat_actors:
    title: Search Threat Actors
    description: Search the Intelligence Hub threat actor database
    input:
      search:
        title: Search
        description: Search query to filter threat actors by name or alias
        type: string
        required: false
        example: "APT28"
      page:
        title: Page
        description: Page number for pagination (starts at 1)
        type: integer
        required: false
        default: 1
        example: 1
      page_size:
        title: Page Size
        description: Number of results per page (max 100)
        type: integer
        required: false
        default: 10
        example: 10
    output:
      threat_actors:
        title: Threat Actors
        description: List of threat actors matching the search criteria
        type: "[]object"
        required: true
        example: '[{"name": "APT28", "aliases": ["Fancy Bear"], "nationalities": ["RU"]}]'
      pagination:
        title: Pagination
        description: Pagination information for the results
        type: pagination
        required: false
        example: '{"page": 1, "page_size": 10, "total_count": 135, "total_pages": 14}'
  get_threat_actor:
    title: Get Threat Actor
    description: Get detailed information about a specific threat actor by UUID
    input:
      uuid:
        title: UUID
        description: The threat actor UUID to look up
        type: string
        required: true
        example: "db2101df-e979-433c-b598-17b45d5aeca7"
    output:
      threat_actor:
        title: Threat Actor
        description: Detailed threat actor information
        type: object
        required: true
        example: '{"name": "MuddyWater", "description": "Iranian APT group...", "aliases": ["TA450"]}'
      found:
        title: Found
        description: Whether the threat actor was found
        type: boolean
        required: true
        example: true
  get_threat_actor_cves:
    title: Get Threat Actor CVEs
    description: Get CVEs associated with a specific threat actor
    input:
      uuid:
        title: UUID
        description: The threat actor UUID to look up CVEs for
        type: string
        required: true
        example: "db2101df-e979-433c-b598-17b45d5aeca7"
      page:
        title: Page
        description: Page number for pagination (starts at 1)
        type: integer
        required: false
        default: 1
        example: 1
      page_size:
        title: Page Size
        description: Number of results per page (max 100)
        type: integer
        required: false
        default: 10
        example: 10
    output:
      cves:
        title: CVEs
        description: List of CVEs associated with the threat actor
        type: "[]object"
        required: true
        example: '[{"id": "CVE-2023-27350", "last_updated": "2025-11-04T10:27:38Z"}]'
      pagination:
        title: Pagination
        description: Pagination information for the results
        type: pagination
        required: false
        example: '{"page": 1, "page_size": 10, "total_count": 3, "total_pages": 1}'
