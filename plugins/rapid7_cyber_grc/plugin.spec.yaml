        title: "ID"
        description: "ID of the record to comment on"
        type: integer
        required: true
        example: 1
        order: 2
      comment:
        title: "Comment"
        description: "Text of the comment. A comment over 5000 characters is truncated to fit the Cyber GRC limit, with a warning in the job log, rather than failing the step"
        type: string
        required: true
        example: "Closed in the ticketing system by the asset owner"
        order: 3
      user_id:
        title: "User ID"
        description: "Cyber GRC user ID to record as the author. Cyber GRC rejects a comment that does not name an author, so this is required. Get Users lists the IDs to choose from"
        type: integer
        required: true
        example: 5
        order: 4
      discussion_field_id:
        title: "Discussion Field ID"
        description: "Overrides the Discussion Field ID the action would otherwise read from the record itself. Only needed if the record does not carry one"
        type: integer
        required: false
        example: 12
        order: 5
      form_discussion_id:
        title: "Form Discussion ID"
        description: "Overrides the Form Discussion ID, which the action defaults to the record ID. Cyber GRC does not document how this field resolves, so set it explicitly if comments do not appear against the record"
        type: integer
        required: false
        example: 1
        order: 6
