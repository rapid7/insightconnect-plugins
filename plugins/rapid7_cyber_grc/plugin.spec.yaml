  get_tasks:
    title: "Get Tasks"
    description: "Retrieve tasks from Cyber GRC, optionally narrowed with an OData filter"
    input:
      filter:
        title: "Filter"
        description: "OData $filter expression used to narrow the results, e.g. contains(name, 'phishing') and statusID eq 3"
        type: string
        required: false
        example: "statusID eq 3"
        order: 1
      select:
        title: "Select"
        description: "Comma separated list of fields to return. Leave empty to return every field"
        type: string
        required: false
        example: "id,name,statusID"
        order: 2
      order_by:
        title: "Order By"
        description: "OData $orderby expression, e.g. modifiedDate desc"
        type: string
        required: false
        example: "modifiedDate desc"
        order: 3
      top:
        title: "Top"
        description: "Maximum number of records to return. Leave empty or set to 0 to return every record, paging through the API automatically"
        type: integer
        required: false
        default: 0
        example: 100
        order: 4
      skip:
        title: "Skip"
        description: "Number of records to skip before returning results"
        type: integer
        required: false
        default: 0
        example: 0
        order: 5
      owner:
        title: "Owner"
        description: "Return only tasks assigned to this user, given as an email address or a numeric Cyber GRC user ID. The API exposes the assignee as a nested object with no filterable ID field, so this match is applied by the plugin after the records are read, which means Top and Skip apply to the matching tasks rather than to every task"
        type: string
        required: false
        example: "user@example.com"
        order: 6
      status_id:
        title: "Status ID"
        description: "Return only tasks in this status. Leave empty or set to 0 for every status"
        type: integer
        required: false
        default: 0
        example: 3
        order: 7
      due_within_days:
        title: "Due Within Days"
        description: "Return only tasks due this many days from now or sooner, so a reminder workflow does not have to write the date arithmetic itself. Tasks with no Due Date are left out. Leave empty or set to 0 for every task"
        type: integer
        required: false
        default: 0
        example: 7
        order: 8
      overdue_only:
        title: "Overdue Only"
        description: "Return only tasks whose Due Date has already passed. Applied in addition to Due Within Days, so setting both returns only the overdue tasks"
        type: boolean
        required: false
        default: false
        example: false
        order: 9
    output:
      tasks:
        title: "Tasks"
        description: "The matching tasks"
        type: "[]task"
        required: true
        order: 1
      count:
        title: "Count"
        description: "Number of tasks returned"
        type: integer
        required: true
        example: 1
        order: 2
