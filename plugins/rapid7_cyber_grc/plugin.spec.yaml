triggers:
  monitor_records:
    title: "Monitor Records"
    description: "Poll a Cyber GRC record type and emit records as they are created or updated"
    input:
      record_type:
        title: "Record Type"
        description: "The Cyber GRC record type to poll"
        type: string
        required: true
        default: "Tasks"
        enum:
        - "AnswerSets"
        - "AssessmentQuestions"
        - "Assessments"
        - "Audits"
        - "BusinessObjectives"
        - "Certifications"
        - "Clients"
        - "Contracts"
        - "ControlSetMetrics"
        - "ControlSets"
        - "Departments"
        - "Discussions"
        - "Groups"
        - "ITAssets"
        - "ImpactViews"
        - "Impacts"
        - "Incidents"
        - "LikelihoodViews"
        - "Likelihoods"
        - "Locations"
        - "QuestionSets"
        - "Risks"
        - "SecurityPolicyInfos"
        - "SecurityPolicySettings"
        - "SystemInfos"
        - "TaskTypes"
        - "Tasks"
        - "Users"
        - "VendorTypes"
        - "Vendors"
        example: "Tasks"
        order: 1
      event_type:
        title: "Event Type"
        description: "Which events to emit. Created emits each record once, when it first appears. Updated emits a record every time it changes, but not when it is created. Any emits both"
        type: string
        required: true
        default: "Any"
        enum:
        - "Any"
        - "Created"
        - "Updated"
        example: "Created"
        order: 2
      interval:
        title: "Interval"
        description: "Number of seconds to wait between polls"
        type: integer
        required: true
        default: 300
        example: 300
        order: 3
      filter:
        title: "Filter"
        description: "Additional OData $filter expression narrowing which records are emitted, combined with the timestamp filter using and. Field names are the camelCase names in the API reference, text values are single quoted, and dates are unquoted, for example statusID eq 3, or name eq 'Access Review', or dueDate ne null and dueDate lt 2026-12-31T00:00:00.000Z"
        type: string
        required: false
        example: "statusID eq 3"
        order: 4
    output:
      records:
        title: "Records"
        description: "Records created or updated since the previous poll"
        type: "[]object"
        required: true
        order: 1
      count:
        title: "Count"
        description: "Number of records emitted"
        type: integer
        required: true
        example: 1
        order: 2
  monitor_compliance_drift:
    title: "Monitor Compliance Drift"
    description: "Poll the framework compliance scores and emit the frameworks whose score has fallen"
    input:
      control_set_id:
        title: "Control Set ID"
        description: "ID of a single control set to watch. Leave empty or set to 0 to watch every control set that is enabled and not archived"
        type: integer
        required: false
        default: 0
        example: 0
        order: 1
      drop_threshold:
        title: "Drop Threshold"
        description: "How far a compliance score has to fall between polls before it is reported, in percentage points. Set to 0 to report every fall"
        type: float
        required: true
        default: 5
        example: 5
        order: 2
      minimum_compliance:
        title: "Minimum Compliance"
        description: "Report any framework scoring below this as it crosses the floor, so a framework that is already failing is reported on the first poll rather than only after a further fall. Set to 0 to disable the floor"
        type: float
        required: true
        default: 0
        example: 80
        order: 3
      interval:
        title: "Interval"
        description: "Number of seconds to wait between polls. Cyber GRC recalculates scores periodically rather than continuously, so polling faster than it recalculates adds load without adding detail"
        type: integer
        required: true
        default: 3600
        example: 3600
        order: 4
    output:
      drifts:
        title: "Drifts"
        description: "Frameworks whose compliance score fell by at least the Drop Threshold or sits below the Minimum Compliance floor, worst fall first"
        type: "[]compliance_drift"
        required: true
        order: 1
      count:
        title: "Count"
        description: "Number of frameworks reported"
        type: integer
        required: true
        example: 1
        order: 2
