actions:
  get_risks:
    title: "Get Risks"
    description: "Retrieve risks from Cyber GRC, optionally narrowed with an OData filter"
    input:
      filter:
        title: "Filter"
        description: "OData $filter expression used to narrow the results, e.g. contains(name, 'phishing') and statusID eq 3"
        type: string
        required: false
        example: "statusID eq 3"
        order: 1
      select:
        title: "Select"
        description: "Comma separated list of fields to return. Leave empty to return every field"
        type: string
        required: false
        example: "id,name,statusID"
        order: 2
      order_by:
        title: "Order By"
        description: "OData $orderby expression, e.g. modifiedDate desc"
        type: string
        required: false
        example: "modifiedDate desc"
        order: 3
      top:
        title: "Top"
        description: "Maximum number of records to return. Leave empty or set to 0 to return every record, paging through the API automatically"
        type: integer
        required: false
        default: 0
        example: 100
        order: 4
      skip:
        title: "Skip"
        description: "Number of records to skip before returning results"
        type: integer
        required: false
        default: 0
        example: 0
        order: 5
    output:
      risks:
        title: "Risks"
        description: "The matching risks"
        type: "[]risk"
        required: true
        order: 1
      count:
        title: "Count"
        description: "Number of risks returned"
        type: integer
        required: true
        example: 1
        order: 2
  get_risk:
    title: "Get Risk"
    description: "Retrieve a single risk by ID"
    input:
      id:
        title: "ID"
        description: "ID of the risk to retrieve"
        type: integer
        required: true
        example: 1
        order: 1
      select:
        title: "Select"
        description: "Comma separated list of fields to return. Leave empty to return every field"
        type: string
        required: false
        example: "id,name"
        order: 2
    output:
      risk:
        title: "Risk"
        description: "The requested risk"
        type: risk
        required: true
        order: 1
  create_risk:
    title: "Create Risk"
    description: "Create a new risk in Cyber GRC"
    input:
      record:
        title: "Risk"
        description: "The risk to create, as a JSON object matching the CreateRiskDto schema in the Rapid7 Cyber GRC API reference. A description over 2000 characters is truncated to fit the Cyber GRC limit, with a warning in the job log, rather than failing the step"
        type: object
        required: true
        example: {"name": "Example risk"}
        order: 1
    output:
      risk:
        title: "Risk"
        description: "The created risk"
        type: risk
        required: true
        order: 1
  update_risk:
    title: "Update Risk"
    description: "Update an existing risk in Cyber GRC"
    input:
      id:
        title: "ID"
        description: "ID of the risk to update"
        type: integer
        required: true
        example: 1
        order: 1
      record:
        title: "Risk"
        description: "The fields to write, as a JSON object matching the UpdateRiskDto schema in the Rapid7 Cyber GRC API reference. A description over 2000 characters is truncated to fit the Cyber GRC limit, with a warning in the job log, rather than failing the step"
        type: object
        required: true
        example: {"name": "Renamed risk"}
        order: 2
    output:
      risk:
        title: "Risk"
        description: "The updated risk"
        type: risk
        required: true
        order: 1
  delete_risk:
    title: "Delete Risk"
    description: "Delete a risk by ID"
    input:
      id:
        title: "ID"
        description: "ID of the risk to delete"
        type: integer
        required: true
        example: 1
        order: 1
    output:
      result:
        title: "Result"
        description: "Outcome of the delete operation"
        type: delete_operation_response
        required: true
        order: 1
