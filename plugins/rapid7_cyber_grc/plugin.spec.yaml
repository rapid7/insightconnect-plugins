        description: "The type of record to comment on"
        type: string
        required: true
        default: "Tasks"
        enum:
        - "Audits"
        - "Clients"
        - "Contracts"
        - "ControlSets"
        - "Departments"
        - "ITAssets"
        - "Incidents"
        - "Locations"
        - "Risks"
        - "Tasks"
        - "Vendors"
