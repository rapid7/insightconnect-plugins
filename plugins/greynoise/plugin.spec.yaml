  timeline_lookup:
    title: IP Timeline Lookup
    description: Query a routable IPv4 address for GreyNoise daily timeline details
    input:
      ip_address:
        title: IP Address
        description: Routable IPv4 address to query
        type: string
        required: true
        example: 1.2.3.4
      days:
        title: Days
        description: Number of days of daily timeline data to return
        type: integer
        required: false
        default: 7
        example: 1
    output:
      ip:
        title: IP Queried
        type: string
        description: Value that was Queried
        required: false
        example: 100.29.192.92
      metadata:
        title: IP Timeline Metadata
        type: timeline_metadata
        description: Metadata returned by the GreyNoise daily timeline
        required: false
        example: {"ip": "100.29.192.92","days": 1,"granularity": "1d","field": "classification"}
      data:
        title: Daily Timeline
        type: "[]timeline_day"
        description: Daily timeline records consolidated by the GreyNoise SDK
        required: false
        example: [{"date": "2026-10-30T00:00:00Z","asns": ["AS14618"],"organizations": ["Amazon.com, Inc."],"tags": ["DNS Protocol"],"classification": ["unknown"],"rdns": ["ec2-100-29-192-92.compute-1.amazonaws.com"],"ports": ["80","443"]}]
  callback_ip_lookup:
    title: Callback IP Lookup
    description: Look up a callback IP in the GreyNoise C2 detection dataset
    input:
      ip_address:
        title: IP Address
        description: Callback IPv4 address to query
        type: string
        required: true
        example: 198.51.100.42
      source_workspace:
        title: Source Workspace
        description: Workspace filter. Use all, or a workspace name such as GreyNoise, UserWorkspace, or Community
        type: string
        required: false
        default: "all"
        example: "all"
    output:
      ip:
        title: IP Address
        description: Callback IP address
        type: string
        required: false
        example: 198.51.100.42
      source_workspaces:
        title: Source Workspaces
        description: Workspace sources where this IP was observed
        type: "[]string"
        required: false
        example: ["GreyNoise","UserWorkspace"]
      is_stage_1:
        title: Stage 1
        description: Whether a file was successfully downloaded from this IP
        type: boolean
        required: false
        example: false
      is_stage_2:
        title: Stage 2
        description: Whether this IP is suspected command and control
        type: boolean
        required: false
        example: false
      first_seen:
        title: First Seen
        description: When this IP was first observed
        type: string
        required: false
        example: "2025-03-01T00:00:00Z"
      last_seen:
        title: Last Seen
        description: When this IP was most recently observed
        type: string
        required: false
        example: "2025-03-15T12:30:00Z"
      scanner_ips:
        title: Scanner IPs
        description: Scanner IPs that delivered payloads referencing this callback IP
        type: "[]string"
        required: false
        example: ["203.0.113.7","192.0.2.99"]
      scanner_count:
        title: Scanner Count
        description: Number of distinct scanners associated with this IP
        type: integer
        required: false
        example: 5
      file_count:
        title: File Count
        description: Number of malware files associated with this IP
        type: integer
        required: false
        example: 3
      active_files:
        title: Active Files
        description: Malware files associated with this callback IP
        type: "[]callback_file"
        required: false
        example: [{"sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","file_name": "payload.bin","type": "application/x-executable"}]
      message:
        title: Message
        description: Status message when the IP is not found in the requested workspace
        type: string
        required: false
        example: ""
