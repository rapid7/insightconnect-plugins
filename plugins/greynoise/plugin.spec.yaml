plugin_spec_version: v2
extension: plugin
products: [insightconnect]
name: greynoise
title: GreyNoise
description: GreyNoise helps analysts recognize events not worth their attention. Indicators in GreyNoise are likely associated with opportunistic internet scanning or common business services, not targeted threats. This context helps analysts focus on what matters most
version: 3.0.0
connection_version: 2
cloud_ready: true
sdk:
  type: slim
  version: latest
  user: nobody
supported_versions: ["GreyNoise API v3"]
vendor: greynoise
status: []
tags: [greynoise, ip lookup, threat intel, intelligence]
support: partner
resources:
  source_url: https://github.com/rapid7/insightconnect-plugins/tree/master/plugins/greynoise
  license_url: https://github.com/rapid7/insightconnect-plugins/blob/master/LICENSE
  vendor_url: https://greynoise.io
hub_tags:
  use_cases: [data_enrichment, threat_detection_and_response,vulnerability_management]
  keywords: [threat_intelligence, enrichment, ip_address, intel, scanner, cve]
  features: []
requirements:
  - "A GreyNoise API key"
key_features:
  - "Perform a GreyNoise IP Lookup"
  - "Perform a GreyNoise IP Quick Lookup"
  - "Query for additional Tag details"
  - "Perform a GreyNoise Community IP Lookup"
  - "Perform a GreyNoise Vulnerability Lookup"
  - "Perform a GreyNoise IP Timeline Lookup"
  - "Look up a GreyNoise Callback IP"
  - "Query a list of IPs on a Trigger"
troubleshooting: "Ensure that the GreyNoise API key used has appropriate access for the actions being used."
version_history:
  - "3.0.0 - Upgrade GreyNoise SDK v3.1.0 | Add `ip_lookup` and `callback_ip_lookup` | Keep `context_lookup` and `riot_lookup` as aliases that call `ip_lookup` | Update `quick_lookup`, `gnql_query`, `get_tag_details`, and `monitor_ips_in_greynoise` for the v3 API | Remove `similar_lookup` | Updated SDK to the latest version (6.6.1)"
  - "2.0.0 - Upgrade GreyNoise SDK v2.3.0 | Fix Action Outputs | New actions:`vulnerability_lookup`, `timeline_lookup`, `similar_lookup` | New trigger: `greynoise_alert`"
  - "1.0.1 - Fix bug with connection parameters"
  - "1.0.0 - Initial plugin."
links:
 - "[GreyNoise](https://greynoise.io)"
references:
 - "[GreyNoise Documentation](https://docs.greynoise.io)"
 - "[GreyNoise Free Trial Signup](https://viz.greynoise.io/signup)"
 - "[GreyNoise Account Info](https://viz.greynoise.io/account)"
enable_cache: false
types:
  metadata:
    asn:
      title: ASN
      type: string
      description: ASN
      required: false
      example: "AS12345"
    category:
      title: Category
      type: string
      description: Category
      required: false
      example: "isp"
    city:
      title: City
      type: string
      description: City
      required: false
      example: "Reno"
    country:
      title: Country
      type: string
      description: Country
      required: false
      example: "Brazil"
    country_code:
      title: Country Code
      type: string
      description: Country Code
      required: false
      example: "BZ"
    organization:
      title: Organization
      type: string
      description: Organization
      required: false
      example: "Acme Inc."
    os:
      title: OS
      type: string
      description: OS
      required: false
      example: "Windows XP"
    rdns:
